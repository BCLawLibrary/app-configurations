name: Publish package

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use a current npm (trusted publishing needs it)
        run: npm install -g npm@latest

      - name: Read package and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error::No package folder packages/$PKG for tag $TAG"
            exit 1
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        run: |
          ACTUAL=$(node -p "require('./packages/${{ steps.tag.outputs.pkg }}/package.json').version")
          if [ "$ACTUAL" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.tag.outputs.version }} but package.json says $ACTUAL. Run npm version first."
            exit 1
          fi

      - name: Install dependencies (a package may need them to build)
        run: npm ci

      - name: Run the same checks as pull requests
        run: npm run check

      - name: Publish
        run: npm publish --workspace "packages/${{ steps.tag.outputs.pkg }}"
